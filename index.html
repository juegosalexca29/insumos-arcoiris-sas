const initial={company:{name:'INSUMOS ARCOÍRIS SAS',nit:'',phone:'313 376 6034',address:'Calle 43 Sur #53-05 local 201, La Alquería, Bogotá',email:'',instagram:'@insumos.arcoiris.sas'},clients:[],suppliers:[],items:[],purchases:[],quotes:[],movements:[]};

function go(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=navs.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('app').innerHTML=({inicio:home,quotes:quotesPage,clients:()=>master('clients'),items:()=>master('items'),suppliers:()=>master('suppliers'),purchases:purchasesPage,movements:movementsPage,reports:reportsPage,company:companyPage})[page]();}
function home(){let stock=db.items.filter(x=>x.kind==='Producto').reduce((a,x)=>a+Number(x.stock||0),0);return `<section class="card"><h2>Panel general</h2><div class="stats"><div class="stat">Clientes<b>${db.clients.length}</b></div><div class="stat">Productos y servicios<b>${db.items.length}</b></div><div class="stat">Unidades en inventario<b>${stock}</b></div><div class="stat">Cotizaciones<b>${db.quotes.length}</b></div><div class="stat">Compras registradas<b>${db.purchases.length}</b></div><div class="stat">Movimientos<b>${db.movements.length}</b></div></div></section><section class="card"><h2>Últimos movimientos</h2>${movementTable(db.movements.slice(0,8))}</section><p class="notice">Esta versión guarda los datos en el navegador de este dispositivo. Para compartir la misma información entre computador y celular, falta conectar una base de datos en la nube.</p>`}
const field=(label,name,val='',type='text',extra='')=>`<div><label>${label}</label><input id="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`;
function master(k){let titles={clients:'Clientes',items:'Productos y servicios',suppliers:'Proveedores'},fields={clients:[['name','Nombre / razón social'],['doc','NIT / cédula'],['phone','Teléfono'],['address','Dirección'],['email','Correo']],suppliers:[['name','Nombre / razón social'],['doc','NIT'],['phone','Teléfono'],['address','Dirección'],['email','Correo'],['contact','Persona de contacto']],items:[['name','Nombre del producto o servicio'],['sku','Código / referencia'],['kind','Tipo'],['unit','Unidad'],['price','Precio de venta'],['cost','Costo'],['stock','Existencias']]};let fs=fields[k];return `<section class="card"><h2>Registrar ${titles[k].toLowerCase()}</h2><div class="grid">${fs.map(([f,l])=>f==='kind'?`<div><label>${l}</label><select id="f_${f}"><option>Producto</option><option>Servicio</option></select></div>`:f==='unit'?`<div><label>${l}</label><select id="f_${f}"><option>Unidad</option><option>Metro</option><option>Rollo</option><option>Servicio</option><option>Par</option><option>Docena</option><option>Kg</option></select></div>`:field(l,'f_'+f,'', ['price','cost','stock'].includes(f)?'number':'text', ['price','cost','stock'].includes(f)?'min="0" step="0.01"':'' )).join('')}</div><button class="primary" onclick="addMaster('${k}')">Guardar</button></section><section class="card"><h2>${titles[k]} registrados</h2><div class="tablewrap"><table><tr>${fs.map(x=>`<th>${x[1]}</th>`).join('')}<th>Acción</th></tr>${db[k].map(x=>`<tr>${fs.map(([f])=>`<td>${esc(x[f])}</td>`).join('')}<td><button class="danger" onclick="removeRecord('${k}','${x.id}')">Eliminar</button></td></tr>`).join('')||`<tr><td colspan="${fs.length+1}" class="empty">Sin registros todavía</td></tr>`}</table></div></section>`}
function addMaster(k){let fs={clients:['name','doc','phone','address','email'],suppliers:['name','doc','phone','address','email','contact'],items:['name','sku','kind','unit','price','cost','stock']}[k],o={id:id()};fs.forEach(f=>o[f]=$('#f_'+f).value);['price','cost','stock'].forEach(f=>{if(o[f]!==undefined)o[f]=Number(o[f]||0)});if(!o.name.trim())return alert('Escribe el nombre.');if(k==='items'&&o.kind==='Servicio')o.stock=0;db[k].push(o);if(k==='items'&&o.kind==='Producto'&&o.stock>0)movement(o.id,o.name,'Entrada',o.stock,'Inventario inicial','');save();render()}
function removeRecord(k,i){if(confirm('¿Eliminar este registro?')){db[k]=db[k].filter(x=>x.id!==i);save();render()}}
function quoteForm(){return `<section class="card"><h2>Nueva cotización</h2><div class="grid"><div><label>Cliente</label><select id="qclient"><option value="">Seleccionar cliente</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${field('Fecha','qdate',today(),'date')}${field('Válida hasta','qvalid',today(),'date')}</div><div class="row"><button onclick="addQuoteLine()">+ Agregar producto o servicio</button></div><div id="quoteLines"></div>${field('Observaciones','qnote')}<div class="row"><button class="primary" onclick="saveQuote()">Guardar cotización</button></div></section>`}
let qlines=[];function quotesPage(){qlines=[];return `${quoteForm()}<section class="card"><h2>Cotizaciones guardadas</h2>${quoteTable()}</section>`}function addQuoteLine(){qlines.push({item:'',qty:1,desc:'',price:0});$('#quoteLines').innerHTML=quoteLinesHtml()}function quoteLinesHtml(){return `<div class="tablewrap"><table class="lineitems"><tr><th>Producto / servicio</th><th>Cantidad</th><th>Descripción</th><th>Precio unitario</th><th>Subtotal</th><th></th></tr>${qlines.map((l,i)=>`<tr><td><select onchange="qlines[${i}].item=this.value;let z=db.items.find(x=>x.id===this.value);qlines[${i}].price=z?.price||0;qlines[${i}].desc=z?.name||'';$('#quoteLines').innerHTML=quoteLinesHtml()"><option value="">Seleccionar</option>${db.items.map(x=>`<option value="${x.id}" ${l.item===x.id?'selected':''}>${esc(x.name)} (${x.kind})</option>`).join('')}</select></td><td><input type="number" min="0.01" step="0.01" value="${l.qty}" onchange="qlines[${i}].qty=+this.value;$('#quoteLines').innerHTML=quoteLinesHtml()"></td><td><input value="${esc(l.desc)}" onchange="qlines[${i}].desc=this.value"></td><td><input type="number" min="0" value="${l.price}" onchange="qlines[${i}].price=+this.value;$('#quoteLines').innerHTML=quoteLinesHtml()"></td><td>${money(l.qty*l.price)}</td><td><button class="danger" onclick="qlines.splice(${i},1);$('#quoteLines').innerHTML=quoteLinesHtml()">×</button></td></tr>`).join('')}</table></div><p class="right"><b>Total: ${money(qlines.reduce((a,x)=>a+x.qty*x.price,0))}</b></p>`}
function saveQuote(){let c=db.clients.find(x=>x.id===$('#qclient').value);if(!c)return alert('Selecciona un cliente.');if(!qlines.length)return alert('Agrega al menos un concepto.');let q={id:id(),number:next('COT',db.quotes),date:$('#qdate').value,valid:$('#qvalid').value,client:c,lines:qlines.map(x=>({...x})),note:$('#qnote').value,status:'Cotizada'};q.total=q.lines.reduce((a,x)=>a+x.qty*x.price,0);db.quotes.unshift(q);save();render();printQuote(q.id)}
function quoteTable(){return `<div class="tablewrap"><table><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th></th></tr>${db.quotes.map(q=>`<tr><td>${q.number}</td><td>${q.date}</td><td>${esc(q.client.name)}</td><td>${money(q.total)}</td><td>${q.status}</td><td><button onclick="printQuote('${q.id}')">Ver / imprimir</button> ${q.status==='Cotizada'?`<button onclick="convertQuote('${q.id}')">Crear pedido</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay cotizaciones</td></tr>'}</table></div>`}
function printQuote(i){let q=db.quotes.find(x=>x.id===i);printDoc('COTIZACIÓN '+q.number,`<p><b>Cliente:</b> ${esc(q.client.name)} · ${esc(q.client.doc)}<br><b>Teléfono:</b> ${esc(q.client.phone)} · <b>Dirección:</b> ${esc(q.client.address)}</p><p>Fecha: ${q.date} · Válida hasta: ${q.valid}</p>${lineTable(q.lines)}<h2 class="right">TOTAL: ${money(q.total)}</h2><p>Observaciones: ${esc(q.note)}</p>`)}
function convertQuote(i){let q=db.quotes.find(x=>x.id===i);if(!confirm('¿Convertir esta cotización en pedido y registrar la salida de inventario?'))return;for(let l of q.lines){let p=db.items.find(x=>x.id===l.item);if(p&&p.kind==='Producto'&&p.stock<l.qty)return alert('Inventario insuficiente: '+p.name)}for(let l of q.lines){let p=db.items.find(x=>x.id===l.item);if(p&&p.kind==='Producto'){p.stock-=l.qty;movement(p.id,p.name,'Salida',l.qty,q.number,'Pedido entregado a '+q.client.name)}}q.status='Pedido / entregado';save();render()}
function lineTable(lines){return `<div class="tablewrap"><table><tr><th>Cantidad</th><th>Descripción</th><th>Precio unitario</th><th>Subtotal</th></tr>${lines.map(l=>`<tr><td>${l.qty}</td><td>${esc(l.desc)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table></div>`}
function purchasesPage(){return `<section class="card"><h2>Registrar compra / entrada de mercancía</h2><div class="grid"><div><label>Proveedor</label><select id="p_supplier"><option value="">Seleccionar proveedor</option>${db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div><label>Producto</label><select id="p_item">${db.items.filter(x=>x.kind==='Producto').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>${field('Cantidad recibida','p_qty','1','number','min="0.01" step="0.01"')}${field('Costo unitario','p_cost','0','number','min="0" step="0.01"')}${field('Fecha','p_date',today(),'date')}${field('Factura / referencia','p_ref')}</div><button class="primary" onclick="savePurchase()">Guardar compra y aumentar inventario</button></section><section class="card"><h2>Historial de compras</h2>${purchaseTable()}</section>`}
function savePurchase(){let p=db.items.find(x=>x.id===$('#p_item').value),s=db.suppliers.find(x=>x.id===$('#p_supplier').value),qty=Number($('#p_qty').value),cost=Number($('#p_cost').value);if(!p||!s||qty<=0)return alert('Selecciona proveedor, producto y cantidad válida.');p.stock=Number(p.stock||0)+qty;p.cost=cost;let rec={id:id(),number:next('COM',db.purchases),date:$('#p_date').value,supplier:s,item:p.name,qty,cost,ref:$('#p_ref').value,total:qty*cost};db.purchases.unshift(rec);movement(p.id,p.name,'Entrada',qty,rec.number,'Compra a '+s.name);save();render()}
function purchaseTable(){return `<div class="tablewrap"><table><tr><th>Número</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Costo total</th></tr>${db.purchases.map(p=>`<tr><td>${p.number}</td><td>${p.date}</td><td>${esc(p.supplier.name)}</td><td>${esc(p.item)}</td><td>${p.qty}</td><td>${money(p.total)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay compras registradas</td></tr>'}</table></div>`}
function movement(pid,name,type,qty,ref,note){db.movements.unshift({id:id(),date:today(),pid,name,type,qty,ref,note})}
function movementTable(L){return `<div class="tablewrap"><table><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Cantidad</th><th>Referencia</th><th>Detalle</th><th></th></tr>${L.map(m=>`<tr><td>${m.date}</td><td><span class="tag">${m.type}</span></td><td>${esc(m.name)}</td><td>${m.qty}</td><td>${esc(m.ref)}</td><td>${esc(m.note)}</td><td><button onclick="printMovement('${m.id}')">Reporte</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin movimientos registrados</td></tr>'}</table></div>`}
function movementsPage(){return `<section class="card"><h2>Registrar entrada o salida manual</h2><div class="grid"><div><label>Movimiento</label><select id="m_type"><option>Entrada</option><option>Salida</option></select></div><div><label>Producto</label><select id="m_item">${db.items.filter(x=>x.kind==='Producto').map(x=>`<option value="${x.id}">${esc(x.name)} · Stock: ${x.stock||0}</option>`).join('')}</select></div>${field('Cantidad','m_qty','1','number','min="0.01" step="0.01"')}${field('Fecha','m_date',today(),'date')}${field('Documento / referencia','m_ref')}${field('Motivo','m_note')}</div><button class="primary" onclick="saveMovement()">Registrar movimiento</button></section><section class="card"><h2>Historial de entradas y salidas</h2>${movementTable(db.movements)}</section>`}
function saveMovement(){let p=db.items.find(x=>x.id===$('#m_item').value),type=$('#m_type').value,qty=Number($('#m_qty').value);if(!p||qty<=0)return alert('Selecciona producto y cantidad válida.');if(type==='Salida'&&p.stock<qty)return alert('No hay existencias suficientes.');p.stock=Number(p.stock||0)+(type==='Entrada'?qty:-qty);movement(p.id,p.name,type,qty,$('#m_ref').value,$('#m_note').value);db.movements[0].date=$('#m_date').value;save();render()}
function printMovement(i){let m=db.movements.find(x=>x.id===i);printDoc('REPORTE DE '+m.type.toUpperCase(),`<div class="grid"><p><b>Consecutivo:</b> ${m.id}</p><p><b>Fecha:</b> ${m.date}</p><p><b>Movimiento:</b> ${m.type}</p><p><b>Producto:</b> ${esc(m.name)}</p><p><b>Cantidad:</b> ${m.qty}</p><p><b>Referencia:</b> ${esc(m.ref)}</p><p><b>Motivo:</b> ${esc(m.note)}</p></div><p>El presente documento deja constancia del movimiento registrado en el inventario.</p><div style="display:flex;justify-content:space-between;margin-top:80px"><span>____________________<br>Elaboró</span><span>____________________<br>Recibió / verificó</span></div>`)}
function reportsPage(){let entradas=db.movements.filter(x=>x.type==='Entrada').length,salidas=db.movements.filter(x=>x.type==='Salida').length;return `<section class="card"><h2>Reportes de inventario</h2><div class="stats"><div class="stat">Entradas<b>${entradas}</b></div><div class="stat">Salidas<b>${salidas}</b></div><div class="stat">Compras<b>${db.purchases.length}</b></div><div class="stat">Valor cotizado<b>${money(db.quotes.reduce((a,x)=>a+x.total,0))}</b></div></div><div class="row"><button onclick="printReport()">Imprimir reporte general</button><button onclick="exportCSV()">Exportar movimientos CSV</button></div></section><section class="card"><h2>Existencias actuales</h2><div class="tablewrap"><table><tr><th>Producto</th><th>Referencia</th><th>Unidad</th><th>Stock</th><th>Costo</th><th>Precio</th></tr>${db.items.filter(x=>x.kind==='Producto').map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.unit)}</td><td>${x.stock||0}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td></tr>`).join('')}</table></div></section><section class="card"><h2>Movimientos recientes</h2>${movementTable(db.movements)}</section>`}
function companyPage(){let c=db.company;return `<section class="card"><h2>Datos de Insumos Arcoíris SAS</h2><div class="grid">${field('Razón social','co_name',c.name)}${field('NIT','co_nit',c.nit)}${field('Teléfono','co_phone',c.phone)}${field('Dirección','co_address',c.address)}${field('Correo','co_email',c.email)}${field('Instagram','co_instagram',c.instagram)}</div><button class="primary" onclick="saveCompany()">Guardar datos de empresa</button></section><section class="card"><h2>Respaldo de información</h2><p class="notice">Los datos actuales se almacenan en este navegador. Descarga respaldos periódicos para no perder la información.</p><button onclick="backup()">Descargar respaldo JSON</button></section>`}
function saveCompany(){db.company={name:$('#co_name').value,nit:$('#co_nit').value,phone:$('#co_phone').value,address:$('#co_address').value,email:$('#co_email').value,instagram:$('#co_instagram').value};save();alert('Datos guardados.');render()}
function printDoc(title,body){let c=db.company,w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir.');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px Arial;margin:35px;color:#172338}header{display:flex;gap:20px;align-items:center;border-bottom:2px solid #12336b;padding-bottom:15px}header img{width:180px;max-height:80px;object-fit:contain}h1{font-size:20px;color:#12336b}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}.right{text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr}</style></head><body><header><img src="${LOGO}"><div><h1>${esc(c.name)}</h1><div>${esc(c.nit)} · ${esc(c.phone)}</div><div>${esc(c.address)}</div><div>${esc(c.email)}</div></div></header><h2>${title}</h2>${body}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function printReport(){printDoc('REPORTE GENERAL DE INVENTARIO',`<p>Fecha de generación: ${today()}</p>${movementTable(db.movements)}<h3>Compras registradas: ${db.purchases.length}</h3><h3>Productos: ${db.items.filter(x=>x.kind==='Producto').length}</h3>`)}
function exportCSV(){let rows=[['Fecha','Tipo','Producto','Cantidad','Referencia','Detalle'],...db.movements.map(m=>[m.date,m.type,m.name,m.qty,m.ref,m.note])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='inventario-arcoiris-'+today()+'.csv';a.click()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='respaldo-arcoiris-'+today()+'.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.company||!x.items)throw 0;db=x;save();render();alert('Respaldo restaurado.')}catch(_){alert('El archivo no es un respaldo válido.')}};r.readAsText(f)}
render();
</script></body></html>
