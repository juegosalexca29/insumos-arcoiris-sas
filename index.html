<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insumos Arcoíris SAS · Sistema</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#17202e;--mut:#667085;--bd:#dde2ea;--ac:#0b2a6f;--act:#fff;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b2028;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2e353f;--ac:#6ea8ff;--act:#06142e;--bad:#f97066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.logo{height:56px;background:#fff;border-radius:8px;padding:2px 8px}
nav{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}nav button{white-space:nowrap}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.on,button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}button.d{color:var(--bad)}
main{padding:16px;max-width:1050px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
.tw{overflow-x:auto;margin:8px 0}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mut)}
.r{text-align:right}th.r{text-align:right}.low{color:var(--bad);font-weight:600}.mut{color:var(--mut)}
h2{font-size:16px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.k{background:var(--bg);border-radius:10px;padding:10px}.k b{display:block;font-size:19px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;padding:16px;z-index:9}
#ov .sheet{background:#fff;color:#111;max-width:780px;margin:auto;padding:28px;border-radius:8px}
#ov table{min-width:0}#ov th,#ov td{border-color:#ddd;color:#111}#ov .hd{display:flex;justify-content:space-between;gap:12px;align-items:center}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;padding:0;display:block!important}#ov .sheet{max-width:none;padding:0}.np{display:none!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$ '+Math.round(n||0).toLocaleString('es-CO'),fd=d=>new Date(d).toLocaleDateString('es-CO'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),pad=(p,n)=>p+'-'+String(n).padStart(4,'0');
$('#lg').src=LOGO;
const def={co:{name:'Insumos Arcoíris SAS',nit:'',addr:'',tel:'',mail:'',iva:19,nq:1,nc:1,base:20588,tope:25,extra:1000},cli:[],prv:[],pro:[],qt:[],pur:[],mov:[]};
let db;try{db=JSON.parse(localStorage.getItem('arc_db'));if(!db||!db.co)db=structuredClone(def)}catch(e){db=structuredClone(def)}
db.co={...def.co,...db.co};if(!db.co.v2){db.co.base=20588;db.co.v2=1}
const save=()=>{try{localStorage.setItem('arc_db',JSON.stringify(db))}catch(e){}};
const addMov=(pid,name,type,qty,ref,note)=>db.mov.unshift({d:new Date().toISOString(),pid,name,type,qty,ref:ref||'',note:note||''});
const T={cot:'Entradas',ped:'Pedidos',inv:'Inventario',rep:'Reportes',cli:'Clientes',cfg:'Mi empresa'};
let tab='cot',ed={},q='',Q=null;
const go=t=>{tab=t;q='';render()};
function render(){$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
$('#m').innerHTML=({cot,ped,inv,rep,cfg,cli:()=>crud('cli')})[tab]()}

/* CLIENTES / PROVEEDORES / PRODUCTOS-SERVICIOS */
const PF=[['name','Nombre / Razón social'],['doc','NIT / C.C.'],['tel','Teléfono'],['addr','Dirección'],['city','Ciudad'],['mail','Correo']];
const S={cli:{t:'Cliente',f:PF}};
function crud(k){const s=S[k],e=ed[k]||{},fl=s.f.filter(f=>!(k=='pro'&&e.id&&f[0]=='stock'));
return `<div class="card"><h2>${e.id?'Editar':'Nuevo'} · ${s.t}</h2><div class="g">${fl.map(([f,l,o])=>`<div><label>${l}</label>${Array.isArray(o)?`<select id="f_${f}">${o.map(x=>`<option ${e[f]==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${f}" ${o=='n'?'type="number" min="0"':''} value="${esc(e[f]??'')}">`}</div>`).join('')}</div>
<div class="row" style="margin:0"><button class="p" onclick="saveR('${k}')">Guardar</button>${e.id?`<button onclick="ed.${k}=null;render()">Cancelar</button>`:''}</div></div>
<div class="card"><input placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=rows('${k}')"><div id="lst">${rows(k)}</div></div>`}
function rows(k){const s=S[k],t=q.toLowerCase(),L=db[k].filter(r=>!t||JSON.stringify(r).toLowerCase().includes(t));
return `<div class="tw"><table><tr>${s.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${L.map(r=>`<tr>${s.f.map(f=>`<td>${['cost','price'].includes(f[0])?money(r[f[0]]):esc(r[f[0]])}</td>`).join('')}<td style="white-space:nowrap"><button onclick="ed.${k}=db.${k}.find(x=>x.id=='${r.id}');render()">Editar</button> <button class="d" onclick="delR('${k}','${r.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=9 class="mut">Sin registros.</td></tr>'}</table></div>`}
function saveR(k){const e=ed[k]||{},o={};S[k].f.forEach(([f,l,t])=>{const el=$('#f_'+f);if(el)o[f]=t=='n'?+el.value||0:el.value.trim()});
if(!o.name)return alert('Escribe el nombre o la descripción');
if(e.id)Object.assign(e,o);else{o.id=uid();if(k=='pro'){if(o.type=='Servicio')o.stock=0;else if(o.stock>0)addMov(o.id,o.name,'E',o.stock,'','Stock inicial')}db[k].push(o)}
ed[k]=null;save();render()}
let _cb=null;
function ask(msg,fn){_cb=fn;$('#ov').innerHTML=`<div class="sheet" style="max-width:380px"><p>${esc(msg)}</p><div class="row"><button class="d" onclick="$('#ov').style.display='none';_cb()">Sí, eliminar</button><button onclick="$('#ov').style.display='none'">Cancelar</button></div></div>`;$('#ov').style.display='block'}
function delR(k,id){ask('¿Eliminar este registro?',()=>{db[k]=db[k].filter(r=>r.id!=id);save();render()})}

/* DOCUMENTO IMPRIMIBLE */
function doc(o){const c=db.co,p=o.party;
$('#ov').innerHTML=`<div class="sheet"><div class="np row" style="margin:0 0 12px"><button class="p" onclick="print()">Imprimir / PDF</button><button onclick="$('#ov').style.display='none'">Cerrar</button></div>
<div class="hd"><img src="${LOGO}" style="height:70px" alt=""><div style="text-align:right"><b style="font-size:19px">${o.title}</b><br>${o.n}<br>${o.date}</div></div>
<p style="margin:10px 0"><b>${esc(c.name)}</b> · NIT ${esc(c.nit)}<br>${esc(c.addr)} · Tel. ${esc(c.tel)} · ${esc(c.mail)}</p><hr>
${p?`<p><b>${o.pl}:</b> ${esc(p.name)} · NIT/C.C. ${esc(p.doc)}<br><b>Teléfono:</b> ${esc(p.tel)} · <b>Dirección:</b> ${esc(p.addr)} ${esc(p.city)} · ${esc(p.mail)}</p>`:''}
<table><tr>${o.cols.map((h,i)=>`<th class="${o.al[i]=='r'?'r':''}">${h}</th>`).join('')}</tr>${o.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${o.al[i]=='r'?'r':''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table>
<p style="text-align:right">${o.tot.map((t,i)=>i==o.tot.length-1?`<b style="font-size:18px">${t[0]}: ${t[1]}</b>`:`${t[0]}: ${t[1]}<br>`).join('')}</p>${o.note?`<p><b>Observaciones:</b> ${esc(o.note)}</p>`:''}${o.qr?`<div style="margin-top:10px"><img src="${QRIMG}" style="width:140px;height:140px" alt="QR"></div>`:''}</div>`;$('#ov').style.display='block'}

/* COTIZACIONES */
const cp=m=>m>0?db.co.base+Math.max(0,Math.ceil(m-db.co.tope))*db.co.extra:0;
const tt=(it,iva)=>{const sub=it.reduce((a,i)=>a+i.price,0),v=iva?sub*db.co.iva/100:0;return{sub,v,total:sub+v}};
function cot(){Q=Q||{c:{},items:[],iva:true,valid:15,note:''};const t=tt(Q.items,Q.iva);
return `<div class="card"><h2>${Q.edit?'Editando '+(db.qt.find(i=>i.id==Q.edit)||{}).n:'Nueva entrada '+pad('ENT',db.co.nq)}</h2><div class="g">
<div><label>Nombre del cliente</label><input list="dl" value="${esc(Q.c.name)}" placeholder="Escribe el nombre" onchange="nm(this.value)"><datalist id="dl">${db.cli.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div>
<div><label>Validez (días)</label><input type="number" value="${Q.valid}" onchange="Q.valid=+this.value"></div>
<div><label>IVA</label><select onchange="Q.iva=this.value=='1';render()"><option value="1" ${Q.iva?'selected':''}>Con IVA ${db.co.iva}%</option><option value="0" ${Q.iva?'':'selected'}>Sin IVA</option></select></div></div>
<div class="g">${[['doc','NIT / C.C.'],['tel','Teléfono'],['addr','Dirección'],['city','Ciudad'],['mail','Correo']].map(([f,l])=>`<div><label>${l}</label><input value="${esc(Q.c[f])}" onchange="Q.c.${f}=this.value"></div>`).join('')}</div>
<div class="row"><button class="p" onclick="addL()">+ Agregar corte</button><span class="mut">Mínimo ${money(db.co.base)} hasta ${db.co.tope} m · cada metro adicional suma ${money(db.co.extra)} · precios antes de IVA</span></div>
<div class="tw"><table><tr><th>Metros</th><th>Tipo de corte</th><th>Medida de corte</th><th>Descripción de la tela</th><th class="r">Costo</th><th></th></tr>
${Q.items.map((i,x)=>`<tr><td><input type="number" min="0.5" step="0.5" style="width:80px" value="${i.qty}" onchange="Q.items[${x}].qty=+this.value;Q.items[${x}].price=cp(+this.value);render()"></td><td><select onchange="Q.items[${x}].tipo=this.value">${['Al hilo','Al través','Al sesgo'].map(s=>`<option ${i.tipo==s?'selected':''}>${s}</option>`).join('')}</select></td><td><input value="${esc(i.med)}" placeholder="Ej: 15 cm" style="min-width:110px" onchange="Q.items[${x}].med=this.value"></td><td><input value="${esc(i.desc)}" placeholder="Ej: Popelina azul rey" onchange="Q.items[${x}].desc=this.value"></td><td class="r"><input type="number" min="0" style="width:110px" value="${i.price}" onchange="Q.items[${x}].price=+this.value;render()"></td><td><button class="d" onclick="Q.items.splice(${x},1);render()">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Agrega los cortes de la cotización.</td></tr>'}</table></div>
${Q.edit&&Q.pago?`<label>Método de pago</label><select onchange="Q.pago=this.value">${PM.map(m=>`<option ${Q.pago==m?'selected':''}>${m}</option>`).join('')}</select>`:''}<label>Observaciones / condiciones</label><input value="${esc(Q.note)}" onchange="Q.note=this.value">
<p class="r">Subtotal ${money(t.sub)}${Q.iva?` · IVA ${money(t.v)}`:''}<br><b style="font-size:20px">Total ${money(t.total)}</b></p>
<div class="row" style="margin:0"><button class="p" onclick="saveQ()">${Q.edit?'Guardar cambios':'Guardar entrada'}</button>${Q.edit?'<button onclick="Q=null;render()">Cancelar edición</button>':''}</div></div>
<div class="card"><h2>Entradas</h2>${qrows(db.qt)}</div>`}
function addL(){Q.items.push({qty:1,tipo:'Al hilo',med:'',desc:'',price:cp(1)});render()}
function editQ(id){const x=db.qt.find(i=>i.id==id);if(!x)return;Q={c:{...x.cli},items:x.items.map(i=>({...i})),iva:x.ivaOn!==false,valid:x.valid,note:x.note||'',edit:id,pago:x.desp?(x.pago||'Efectivo'):''};tab='cot';q='';render();window.scrollTo(0,0)}
function nm(v){Q.c.name=v.trim();const f=db.cli.find(x=>x.name.toLowerCase()==Q.c.name.toLowerCase());if(f){Q.c={...f};delete Q.c.id}render()}
function saveQ(){const c={...Q.c};if(!c.name)return alert('Escribe el nombre del cliente');if(!db.cli.some(x=>x.name.toLowerCase()==c.name.toLowerCase()))db.cli.push({id:uid(),...c});if(!Q.items.length)return alert('Agrega al menos un corte');
if(Q.edit){const x=db.qt.find(i=>i.id==Q.edit);if(!x){Q=null;return render()}Object.assign(x,{cli:{...c},items:Q.items.map(i=>({...i})),...tt(Q.items,Q.iva),ivaOn:Q.iva,valid:Q.valid,note:Q.note});if(x.desp&&Q.pago)x.pago=Q.pago;Q=null;save();render();return showQ(x.id)}
const t=tt(Q.items,Q.iva),r={id:uid(),n:pad('ENT',db.co.nq++),date:new Date().toISOString(),cli:{...c},items:Q.items.map(i=>({...i})),...t,ivaOn:Q.iva,valid:Q.valid,note:Q.note,st:'Pendiente',desp:false};
db.qt.unshift(r);Q=null;save();render();showQ(r.id)}
const qrows=L=>`<div class="tw"><table><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th class="r">Total</th><th>Estado</th><th></th></tr>${L.map(x=>`<tr><td>${x.n}</td><td>${fd(x.date)}</td><td>${esc(x.cli.name)}</td><td class="r">${money(x.total)}</td><td>${x.desp?'✅ Entregada · '+esc(x.pago||'—')+' · '+fd(x.fout||x.date):'⏳ Pendiente'}</td><td style="white-space:nowrap"><button onclick="showQ('${x.id}')">Ver / Imprimir</button> <button onclick="editQ('${x.id}')">Editar</button> ${x.desp?'':`<button class="p" onclick="desp('${x.id}')">Entregar</button>`} <button class="d" onclick="delQ('${x.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Sin registros.</td></tr>'}</table></div>`;
const setSt=(id,v)=>{db.qt.find(x=>x.id==id).st=v;save();render()};
const delQ=id=>{const x=db.qt.find(i=>i.id==id);if(!x)return;ask(x.desp?`¿Eliminar la entrada ${x.n}, que ya fue entregada y pagada? Desaparecerá de Salidas y de Reportes.`:`¿Eliminar la entrada ${x.n}?`,()=>{
if(x.desp)x.items.forEach(i=>{const p=db.pro.find(p=>p.id==i.pid);if(p&&p.type=='Producto'){p.stock+=i.qty;addMov(p.id,p.name,'E',i.qty,x.n,'Reverso por eliminación')}});
db.qt=db.qt.filter(i=>i.id!=id);save();render()})};
function showQ(id){const x=db.qt.find(i=>i.id==id),v=new Date(x.date);v.setDate(v.getDate()+x.valid);
doc({title:'ENTRADA DE CORTE',n:x.n,date:fd(x.date)+' · Válida hasta '+fd(v),pl:'Cliente',party:x.cli,cols:['Metros','Tipo de corte','Medida de corte','Descripción de la tela','Costo'],al:'rlllr',rows:x.items.map(i=>[i.qty,i.tipo,i.med||'',i.desc,money(i.price)]),tot:[['Subtotal',money(x.sub)],...(x.ivaOn?[['IVA '+db.co.iva+'%',money(x.v)]]:[]),['TOTAL',money(x.total)]],note:x.note,qr:1})}
const PM=['Efectivo','Nequi','Daviplata','Transferencia'],ds=x=>x.items.map(i=>`${i.qty} m · ${i.tipo}${i.med?' · '+i.med:''} · ${i.desc}`).join('; ');
function desp(id){$('#ov').innerHTML=`<div class="sheet" style="max-width:380px"><h2>¿Cómo pagó el cliente?</h2><div class="row">${PM.map(m=>`<button class="p" onclick="fin('${id}','${m}')">${m}</button>`).join('')}</div><button onclick="$('#ov').style.display='none'">Cancelar</button></div>`;$('#ov').style.display='block'}
function fin(id,m){const x=db.qt.find(i=>i.id==id),L=x.items.map(i=>({i,p:db.pro.find(p=>p.id==i.pid)})).filter(o=>o.p&&o.p.type=='Producto');
for(const o of L)if(o.p.stock<o.i.qty){$('#ov').style.display='none';return alert('Stock insuficiente de: '+o.p.name)}
L.forEach(o=>{o.p.stock-=o.i.qty;addMov(o.p.id,o.p.name,'S',o.i.qty,x.n,'Salida a '+x.cli.name)});
x.pago=m;x.desp=true;x.st='Entregada';x.fout=new Date().toISOString();$('#ov').style.display='none';save();render()}
const ped=()=>`<div class="card"><h2>Pedidos por entregar</h2><p class="mut">Cuando el corte esté listo, presiona Entregar y elige cómo pagó el cliente. Queda registrado en la entrada, en Salidas y en Reportes.</p>${qrows(db.qt.filter(x=>!x.desp&&x.st!='Rechazada'))}</div>`;

/* INVENTARIO */
const sal=()=>db.qt.filter(x=>x.desp).sort((a,b)=>(a.fout||a.date)<(b.fout||b.date)?1:-1);
function regSal(){const id=$('#se').value;if(!id)return alert('No hay entradas pendientes por entregar');fin(id,$('#spg').value)}
function salCard(){const L=sal();return `<div class="card"><h2>Salidas (cortes entregados)</h2><div class="row"><select id="se" style="flex:2;min-width:220px">${pendL().map(x=>`<option value="${x.id}">${x.n} · ${esc(x.cli.name)} · ${money(x.total)}</option>`).join('')||'<option value="">No hay entradas pendientes</option>'}</select><select id="spg" style="width:auto">${PM.map(m=>`<option>${m}</option>`).join('')}</select><button class="p" onclick="regSal()">Registrar entrega</button></div><p class="mut">${PM.map(m=>m+': <b>'+money(L.filter(x=>x.pago==m).reduce((a,x)=>a+x.total,0))+'</b>').join(' · ')}</p><div class="tw"><table><tr><th>Fecha salida</th><th>N°</th><th>Cliente</th><th>Descripción</th><th>Cobro</th><th class="r">Total</th><th></th></tr>${L.map(x=>`<tr><td>${fd(x.fout||x.date)}</td><td>${x.n}</td><td>${esc(x.cli.name)}</td><td>${esc(ds(x))}</td><td>${esc(x.pago||'—')}</td><td class="r">${money(x.total)}</td><td><button class="d" onclick="delQ('${x.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Aún no hay salidas. Aparecen cuando entregas un pedido.</td></tr>'}</table></div></div>`}
const inv=()=>salCard();

/* REPORTES */
function rep(){const D=db.qt.filter(x=>x.desp),cl={};D.forEach(x=>cl[x.cli.name]=(cl[x.cli.name]||0)+x.total);
const K=(a,b)=>`<div class="k"><span class="mut">${a}</span><b>${b}</b></div>`;
return `<div class="card"><div class="g">${K('Vendido (entregado)',money(D.reduce((a,x)=>a+x.total,0)))}${K('Por entregar',pendL().length)}${K('Entregadas y pagadas',pagL().length)}</div></div>${pagCard()}${pendCard()}<div class="card"><h2>Ventas por cliente</h2>${Object.entries(cl).map(([n,v])=>`<div>${esc(n)}: <b>${money(v)}</b></div>`).join('')||'<span class="mut">Aún no hay entregas.</span>'}</div>`}
const srt=L=>L.sort((a,b)=>a.n<b.n?-1:1),pagL=()=>srt(db.qt.filter(x=>x.desp)),pendL=()=>srt(db.qt.filter(x=>!x.desp&&x.st!='Rechazada')),sm=L=>money(L.reduce((a,x)=>a+x.total,0));
const pagCard=()=>`<div class="card"><h2>Pagados · consecutivo</h2><div class="row" style="margin:0"><button onclick="repPag()">Imprimir</button><button class="p" onclick="expPag()">Descargar Excel</button></div><div class="tw"><table><tr><th>N° factura</th><th>Cliente</th><th>Descripción</th><th>Método de pago</th><th class="r">Total</th><th></th></tr>${pagL().map(x=>`<tr><td>${x.n}</td><td>${esc(x.cli.name)}</td><td>${esc(ds(x))}</td><td>${esc(x.pago||'—')}</td><td class="r">${money(x.total)}</td><td><button class="d" onclick="delQ('${x.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Aún no hay pagos registrados.</td></tr>'}</table></div></div>`;
const pendCard=()=>`<div class="card"><h2>Por entregar</h2><button onclick="repPend()">Imprimir</button><div class="tw"><table><tr><th>N°</th><th>Cliente</th><th>Descripción</th><th>Estado</th><th class="r">Total</th></tr>${pendL().map(x=>`<tr><td>${x.n}</td><td>${esc(x.cli.name)}</td><td>${esc(ds(x))}</td><td>${x.st}</td><td class="r">${money(x.total)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">No hay pendientes por entregar.</td></tr>'}</table></div></div>`;
const repPag=()=>doc({title:'REPORTE DE PAGADOS',n:'Consecutivo',date:fd(new Date()),cols:['N° factura','Cliente','Descripción','Método de pago','Total'],al:'llllr',rows:pagL().map(x=>[x.n,x.cli.name,ds(x),x.pago||'—',money(x.total)]),tot:[['Total pagado',sm(pagL())]]});
const repPend=()=>doc({title:'PENDIENTES POR ENTREGAR',n:'Consecutivo',date:fd(new Date()),cols:['N°','Cliente','Descripción','Estado','Total'],al:'llllr',rows:pendL().map(x=>[x.n,x.cli.name,ds(x),x.st,money(x.total)]),tot:[['Total pendiente',sm(pendL())]]});
/* EXCEL (.xlsx) SIN LIBRERÍAS */
function xlsx(head,rows){const X=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])),L=i=>String.fromCharCode(65+i);
const cell=(v,i,r,b)=>typeof v=='number'?`<c r="${L(i)}${r}" s="${b?3:2}"><v>${v}</v></c>`:`<c r="${L(i)}${r}" t="inlineStr" s="${b?1:0}"><is><t>${X(v)}</t></is></c>`;
const all=[[head,1],...rows.map(r=>[r,r.bold?1:0])],W=[16,28,60,18,16];
const sheet=`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${all.map(([r,b],y)=>`<row r="${y+1}">${r.map((v,i)=>cell(v,i,y+1,b)).join('')}</row>`).join('')}</sheetData></worksheet>`;
const H='<?xml version="1.0" encoding="UTF-8"?>',NS='xmlns="http://schemas.openxmlformats.org/',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
return zip([['[Content_Types].xml',H+`<Types ${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
['_rels/.rels',H+`<Relationships ${NS}package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
['xl/workbook.xml',H+`<workbook ${NS}spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="Pagados" sheetId="1" r:id="rId1"/></sheets></workbook>`],
['xl/_rels/workbook.xml.rels',H+`<Relationships ${NS}package/2006/relationships"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
['xl/styles.xml',H+`<styleSheet ${NS}spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;$&quot; #,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" applyFont="1"/><xf numFmtId="164" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" applyNumberFormat="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
['xl/worksheets/sheet1.xml',sheet]])}
function zip(files){const e=new TextEncoder(),ch=[],cd=[],w=(a,n,v)=>{for(let i=0;i<n;i++)a.push((v>>>(8*i))&255)};let off=0;
const T=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}),crc=b=>{let r=-1;for(const x of b)r=T[(r^x)&255]^(r>>>8);return(r^-1)>>>0};
for(const[n,s]of files){const nm=e.encode(n),d=e.encode(s),c=crc(d),h=[],k=[];
w(h,4,0x04034b50);w(h,2,20);w(h,2,0);w(h,2,0);w(h,2,0);w(h,2,0x21);w(h,4,c);w(h,4,d.length);w(h,4,d.length);w(h,2,nm.length);w(h,2,0);
w(k,4,0x02014b50);w(k,2,20);w(k,2,20);w(k,2,0);w(k,2,0);w(k,2,0);w(k,2,0x21);w(k,4,c);w(k,4,d.length);w(k,4,d.length);w(k,2,nm.length);w(k,2,0);w(k,2,0);w(k,2,0);w(k,2,0);w(k,4,0);w(k,4,off);
ch.push(new Uint8Array(h),nm,d);cd.push(new Uint8Array(k),nm);off+=h.length+nm.length+d.length}
const z=[];w(z,4,0x06054b50);w(z,2,0);w(z,2,0);w(z,2,files.length);w(z,2,files.length);w(z,4,cd.reduce((a,x)=>a+x.length,0));w(z,4,off);w(z,2,0);
return new Blob([...ch,...cd,new Uint8Array(z)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function expPag(){const L=pagL();if(!L.length)return alert('Aún no hay facturas pagadas para exportar');
const rows=L.map(x=>[x.n,x.cli.name,ds(x),x.pago||'—',Math.round(x.total)]),tot=['','','','TOTAL',rows.reduce((a,r)=>a+r[4],0)];tot.bold=1;rows.push(tot);
const a=document.createElement('a');a.href=URL.createObjectURL(xlsx(['N° factura','Cliente','Descripción','Método de pago','Total'],rows));a.download='pagados-'+new Date().toISOString().slice(0,10)+'.xlsx';a.click()}

/* EMPRESA Y RESPALDO */
const cfg=()=>`<div class="card"><h2>Datos de Insumos Arcoíris SAS (salen en cada documento)</h2><div class="g">${[['name','Nombre'],['nit','NIT'],['addr','Dirección'],['tel','Teléfono'],['mail','Correo'],['iva','IVA %'],['base','Valor mínimo del corte ($)'],['tope','Metros incluidos en el mínimo'],['extra','Valor por metro adicional ($)'],['nq','Próxima entrada N°']].map(([f,l])=>`<div><label>${l}</label><input value="${esc(db.co[f])}" onchange="db.co.${f}=${['iva','nq','base','tope','extra'].includes(f)?'+this.value':'this.value'};save()"></div>`).join('')}</div></div>`;
function exp(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db));a.download='respaldo-arcoiris-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(e){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.co)throw 0;db=d;save();render()}catch(x){alert('Archivo inválido')}};r.readAsText(e.target.files[0])}
render();
</script></body></html>
